[build]
  command = "npm run build"
  publish = "dist"

# Faz as rotas do React (ex.: /admin) funcionarem ao recarregar a página
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Modelos 3D com o tipo certo
[[headers]]
  for = "/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
[[headers]]
  for = "/*.usdz"
  [headers.values]
    Content-Type = "model/vnd.usdz+zip"
